[project]
name = "code-review-agent"
version = "0.1.0"
description = "A conversational, context-aware code review agent built on LangChain Deep Agents"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "deepagents==0.7.0",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langchain-google-genai==4.3.2",
    "langchain-anthropic>=1.5",
    "langchain-openai>=1.4",
    "chromadb==1.5.9",
    "fastapi==0.128.8",
    "uvicorn==0.39.0",
    "httpx",
    "pandas==2.3.3",
    "numpy==2.0.2",
    "plotly==6.8.0",
    "kaleido==0.2.1",
    "ast-comments==1.3.0",
    "python-dotenv==1.2.1",
    "pydantic==2.13.4",
]

[dependency-groups]
dev = ["pytest", "jupyter"]

[tool.uv]
package = false
# chromadb pulls in onnxruntime, whose newest releases dropped Intel-Mac wheels. Resolve a version that installs there too.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
